* { box-sizing: border-box; margin: 0; padding: 0; }
body {

.galeria {

.foto {

    pointer-events: auto;

}
.btn-imprimir:hover { background: #c73652; }

#lightbox-close {

    font-size: 2.2rem;
    color: #fff;
    cursor: pointer;
    pointer-events: auto;

#lightbox-nav {

#lightbox-nav button:hover { background: #e94560; border-color: #e94560; }
#lb-imprimir {

<script>
// Bloquea clic derecho
document.addEventListener('contextmenu', e => e.preventDefault());
// Bloquea arrastre de imágenes
document.addEventListener('dragstart', e => e.preventDefault());
// Bloquea atajos de teclado de guardar/imprimir
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['s','p','u'].includes(e.key.toLowerCase())) {
        e.preventDefault();
    }
});

const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lightbox-img');
const lbImprimir = document.getElementById('lb-imprimir');
const fotos     = Array.from(document.querySelectorAll('.foto'));
let current     = 0;
const baile     = document.title.split(' · ')[0];

function openLightbox(idx) {{
    current = idx;
    const src = fotos[current].querySelector('img').src;
    const nombre = src.split('/').pop();
    lbImg.src = src;
    lbImprimir.href = `mailto:donprofesor4@gmail.com?subject=Solicitud%20de%20impresión&body=Hola%2C%20me%20interesa%20imprimir%20la%20foto%3A%20${{nombre}}%20del%20${{baile}}.%20Por%20favor%20contáctenme.`;
    lightbox.classList.add('active');
}}
function closeLightbox() {{
    lightbox.classList.remove('active');
    lbImg.src = '';
}}
function prev() {{ current = (current - 1 + fotos.length) % fotos.length; updateLightbox(); }}
function next() {{ current = (current + 1) % fotos.length; updateLightbox(); }}
function updateLightbox() {{
    const src = fotos[current].querySelector('img').src;
    const nombre = src.split('/').pop();
    lbImg.src = src;
    lbImprimir.href = `mailto:donprofesor4@gmail.com?subject=Solicitud%20de%20impresión&body=Hola%2C%20me%20interesa%20imprimir%20la%20foto%3A%20${{nombre}}%20del%20${{baile}}.%20Por%20favor%20contáctenme.`;
}}

fotos.forEach((f, i) => f.addEventListener('click', () => openLightbox(i)));
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', prev);
document.getElementById('lb-next').addEventListener('click', next);
lightbox.addEventListener('click', e => {{ if (e.target === lightbox) closeLightbox(); }});
document.addEventListener('keydown', e => {{
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
}});
</script>
