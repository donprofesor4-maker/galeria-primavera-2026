    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0f0f;
    color: #f0f0f0;
    -webkit-user-select: none;
    user-select: none;
}
header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    text-align: center;
    padding: 3rem 1rem 2rem;
    border-bottom: 3px solid #e94560;
}
header h1 { font-size: 2.4rem; color: #fff; letter-spacing: 2px; }
header p  { color: #aaa; margin-top: 0.5rem; font-size: 1rem; }
footer {
    text-align: center;
    padding: 2rem;
    color: #555;
    font-size: 0.85rem;
    border-top: 1px solid #222;
    margin-top: 3rem;
}
a { color: inherit; text-decoration: none; }
img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

.back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 1.5rem 1.5rem 0;
    color: #e94560;
    border: 1px solid #e94560;
    padding: 0.4rem 1rem;
    border-radius: 20px;
    font-size: 0.9rem;
    transition: all 0.2s;
    pointer-events: auto;
}
.back:hover { background: #e94560; color: #fff; }
.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1.5rem;
}
.foto {
    position: relative;
    overflow: hidden;
    border-radius: 6px;
    cursor: pointer;
}
.foto img {
    width: 100%;
    height: 210px;
    object-fit: cover;
    border-radius: 6px;
    transition: transform 0.2s, opacity 0.2s;
    display: block;
    pointer-events: none;
}
.foto:hover img { transform: scale(1.03); opacity: 0.88; }
.btn-imprimir {
    display: block;
    width: 100%;
    text-align: center;
    background: #e94560;
    color: #fff;
    font-size: 0.82rem;
    padding: 0.4rem;
    border-radius: 0 0 6px 6px;
    text-decoration: none;
    pointer-events: auto;
    transition: background 0.2s;
}
.btn-imprimir:hover { background: #c73652; }
#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.93);
    z-index: 999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
#lightbox.active { display: flex; }
#lightbox img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 4px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
    pointer-events: none;
}
#lightbox-close {
    position: absolute;
    top: 1rem; right: 1.5rem;
    font-size: 2.2rem;
    color: #fff;
    cursor: pointer;
    pointer-events: auto;
}
#lightbox-nav {
    display: flex;
    gap: 2rem;
    margin-top: 1rem;
}
#lightbox-nav button {
    background: rgba(255,255,255,0.1);
    border: 1px solid #555;
    color: #fff;
    padding: 0.4rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.2rem;
    transition: background 0.2s;
}
#lightbox-nav button:hover { background: #e94560; border-color: #e94560; }
#lb-imprimir {
    background: #e94560;
    color: #fff;
    padding: 0.4rem 1.2rem;
    border-radius: 6px;
    font-size: 0.95rem;
    text-decoration: none;
    pointer-events: auto;
    transition: background 0.2s;
}
#lb-imprimir:hover { background: #c73652; }
@media (max-width: 600px) {
    .galeria { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .foto img { height: 140px; }
}
</style>

<div id="lightbox">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-nav">
        <button id="lb-prev">&#8592;</button>
        <a id="lb-imprimir" href="#">📩 Quiero esta impresa</a>
        <button id="lb-next">&#8594;</button>
    </div>
</div>
<footer>Primavera 2026 · Colegio de Cervantes<br><small>© Cactus Multimedia · Todos los derechos reservados</small></footer>
<script>
// Bloquea clic derecho
document.addEventListener('contextmenu', e => e.preventDefault());
// Bloquea arrastre de imágenes
document.addEventListener('dragstart', e => e.preventDefault());
// Bloquea atajos de teclado de guardar/imprimir
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['s','p','u'].includes(e.key.toLowerCase())) {
        e.preventDefault();
    }
});
const lightbox   = document.getElementById('lightbox');
const lbImg      = document.getElementById('lightbox-img');
const lbImprimir = document.getElementById('lb-imprimir');
const fotos      = Array.from(document.querySelectorAll('.foto'));
let current      = 0;

function updateLightbox() {
    const img    = fotos[current].querySelector('img');
    const src    = img.getAttribute('src');
    const partes = src.split('/');
    const nombre = partes[partes.length - 1];
    const baile  = partes[partes.length - 2];
    lbImg.src    = src;
    lbImprimir.href = 'mailto:donprofesor4@gmail.com'
        + '?subject=' + encodeURIComponent('Solicitud de impresión - ' + baile)
        + '&body='    + encodeURIComponent('Hola, me interesa imprimir la foto: ' + nombre + ' del ' + baile + '. Por favor contáctenme.');
}
function openLightbox(idx) { current = idx; updateLightbox(); lightbox.classList.add('active'); }
function closeLightbox()   { lightbox.classList.remove('active'); lbImg.src = ''; }
function prev() { current = (current - 1 + fotos.length) % fotos.length; updateLightbox(); }
function next() { current = (current + 1) % fotos.length; updateLightbox(); }

fotos.forEach((f, i) => f.addEventListener('click', () => openLightbox(i)));
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', prev);
document.getElementById('lb-next').addEventListener('click', next);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
});
</script>
