<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primavera 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f0f;
            color: #f0f0f0;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            text-align: center;
            padding: 3rem 1rem 2rem;
            border-bottom: 3px solid #e94560;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.2rem;
            background: #111;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        nav a {
            color: #e94560;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border: 1px solid #e94560;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        nav a:hover {
            background: #e94560;
            color: #fff;
        }

        section {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        section h2 {
            font-size: 1.6rem;
            color: #e94560;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #333;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .foto img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .foto img:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        #lightbox.active { display: flex; }

        #lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        #lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            line-height: 1;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #555;
            font-size: 0.85rem;
            border-top: 1px solid #222;
            margin-top: 3rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.6rem; }
            .galeria { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .foto img { height: 150px; }
        }
    </style>
</head>

<div id="lightbox">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
</div>

<footer>
    Primavera 2026 · Colegio de Cervantes
</footer>

<script>
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lightbox-img');

    document.querySelectorAll('.foto img').forEach(img => {
        img.addEventListener('click', () => {
            lbImg.src = img.src;
            lightbox.classList.add('active');
        });
    });

    document.getElementById('lightbox-close').addEventListener('click', () => {
        lightbox.classList.remove('active');
        lbImg.src = '';
    });

    lightbox.addEventListener('click', e => {
        if (e.target === lightbox) {
            lightbox.classList.remove('active');
            lbImg.src = '';
        }
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            lightbox.classList.remove('active');
            lbImg.src = '';
        }
    });
</script>
